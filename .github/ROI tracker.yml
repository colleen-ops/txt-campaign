name: reply-tracker

on:
  schedule:
    - cron: "0 13 * * 1-5"   # 9am ET weekdays (EDT)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Funnel + progressing -> Slack (list in thread)
        env:
          CLOSE_API_KEY: ${{ secrets.CLOSE_API_KEY }}
          ENTRANCE_API_KEY: ${{ secrets.ENTRANCE_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL }}
          ENTRANCE_CHANNELS_URL: ${{ vars.ENTRANCE_CHANNELS_URL }}
          ENTRANCE_CAMPAIGNS_URL: ${{ vars.ENTRANCE_CAMPAIGNS_URL }}
          LOOKBACK_DAYS: "14"
        run: python reply_tracker.py
      - name: Commit daily CSV
        run: |
          git config user.name "reply-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "reply-tracker $(date -u +%F)"
          git push
